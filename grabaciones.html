<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Grabaciones CCTV | PreviCheck</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="grabaciones.css">
    <link rel="icon" href="imagenes/logotipo.png" type="image">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('previcheck-tema') || 'dark');</script>
</head>
<body>
    <header>
        <div class="logo-section">
            <div class="logo-container"><img src="imagenes/logo.png" alt="PreviCheck" class="logo-img"></div>
            <span class="sub-title">| Control de Grabaciones CCTV</span>
        </div>
        <div class="header-acciones">
            <a href="index.html" class="btn-header btn-header-inicio">🏠 Inicio</a>
        </div>
    </header>

    <h2 class="main-title">Auditoría de Cámaras por Sede</h2>
    <p class="subtitulo-grabaciones">Selecciona una sede para ver y auditar sus cámaras.</p>

    <div class="organigrama-menu">
        <a href="grabaciones-detalle.html?sede=QOLQAS" class="nodo-raiz nodo-raiz-clicable">
            <div class="nodo-icono nodo-icono-raiz">🏢</div>
            <h2>QOLQAS</h2>
            <p class="contador-camaras" id="contadorQOLQAS">— cámaras</p>
        </a>

        <div class="conector-vertical-raiz"></div>

        <div class="nodos-hijos" id="nodosCT">
            <!-- Se generan por JS: Trujillo, Chiclayo, Piura, Arequipa, Ica, Chimbote, Huancayo -->
        </div>
    </div>

    <script src="errores.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const CENTROS_TRANSFERENCIA = ['TRUJILLO', 'CHICLAYO', 'PIURA', 'AREQUIPA', 'ICA', 'CHIMBOTE', 'HUANCAYO'];

        function renderizarNodosCT(conteos) {
            const cont = document.getElementById('nodosCT');
            cont.innerHTML = CENTROS_TRANSFERENCIA.map(sede => `
                <a href="grabaciones-detalle.html?sede=${encodeURIComponent(sede)}" class="nodo-hijo">
                    <div class="nodo-icono">📍</div>
                    <h3>CT ${sede.charAt(0) + sede.slice(1).toLowerCase()}</h3>
                    <p class="contador-camaras">${conteos[sede] || 0} cámaras</p>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const session = await exigirSesion();
            if (!session) return;

            renderizarNodosCT({});
            const camaras = await listarCamarasCCTV();
            const conteos = {};
            camaras.forEach(c => { conteos[c.sede] = (conteos[c.sede] || 0) + 1; });

            document.getElementById('contadorQOLQAS').textContent = `${conteos['QOLQAS'] || 0} cámaras`;
            renderizarNodosCT(conteos);
        });
    </script>
</body>
</html>
